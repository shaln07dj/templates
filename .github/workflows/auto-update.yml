name: Auto Generate and Commit

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  generate-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config --global user.name "alan01"
          git config --global user.email "alan@outlook.com"

      - name: Run script
        run: |
          ./generate-content.sh

      - name: Commit and push changes
        run: |
          git add .
          git diff --cached --quiet || (
            git commit -m "🤖 Auto-generated files [skip ci]"
            git push
          )

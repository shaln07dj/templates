name: Auto Generate and Commit

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  generate-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config --global user.name "shaln07dj"
          git config --global user.email "shalnsingh@outlook.com"

      - name: Run Python script
        run: |
          python3 generate-content.py

      - name: Commit and push changes
        run: |
          git add .
          git diff --cached --quiet || (
            git commit -m "🤖 Auto-generated files [skip ci]"
            git push
          )

name: Auto Translate MJML on Commit

on:
  push:
    branches: [develop] # Trigger on pushes to the develop branch

permissions:
  contents: write # Grant permission to write to the repository for committing changes

jobs:
  translate-and-commit:
    runs-on: ubuntu-latest # Run the job on a fresh Ubuntu environment
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Securely pass the Gemini API key from GitHub secrets

    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # Checkout your repository code
        with:
          fetch-depth: 2 # Fetch history needed for git diff

      - name: Set up Python
        uses: actions/setup-python@v4 # Set up Python 3.10 environment
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip # Ensure pip is up-to-date
          pip install -r requirements.txt      # Install all dependencies from requirements.txt

      - name: Run MJML translation
        run: python convert_mjml.py # Execute your main translation script

      - name: Commit and push changes
        run: |
          # Configure Git user for the commit
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all changed files to staging
          git add .
          
          # Check if there are any staged changes before committing
          # This prevents empty commits if no translations were generated
          git diff --cached --quiet || (
            git commit -m "🤖 Auto-translated MJML files [skip ci]" # Commit with a message, [skip ci] prevents infinite loops
            git push # Push the changes back to the repository
          )
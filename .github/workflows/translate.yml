name: Auto Translate MJML on Commit

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  translate-and-commit:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MJML translation
        run: python convert_mjml.py

      - name: Commit and push changes
        run: |
          git config --global user.name "shaln07dj"
          git config --global user.email "shalnsingh@outlook.com"
          git add .
          git diff --cached --quiet || (
            git commit -m "🤖 Auto-translated MJML files [skip ci]"
            git push
          )
